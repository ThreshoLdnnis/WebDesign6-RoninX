    .starfield {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      width: 100%;
      height: 100%;
      opacity: 0.9;
    }

    .hero-character {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0.76;
      mix-blend-mode: screen;
      filter: hue-rotate(245deg) saturate(0.82) brightness(0.78) contrast(1.1);
    }

    .hero-character-highlight {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 1;
      mix-blend-mode: normal;
      filter: none;
      -webkit-mask-image: radial-gradient(circle 0px at -999px -999px, #fff, transparent);
      mask-image: radial-gradient(circle 0px at -999px -999px, #fff, transparent);
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }

    .hero-ui {
      position: absolute;
      inset: 0;
      z-index: 8;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr auto;
      padding: 36px 44px 40px;
      pointer-events: none;
    }

    .hero-left {
      grid-column: 1;
      grid-row: 1 / -1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      gap: 28px;
      min-width: 0;
    }

    .hero-copy {
      max-width: 520px;
      padding-right: 56px;
      pointer-events: auto;
    }

    .hero-copy h1 {
      font-size: clamp(1.55rem, 3.6vw, 3.15rem);
      line-height: 1.05;
      text-transform: uppercase;
      color: var(--cream);
      text-shadow: 0 2px 28px rgba(53, 16, 94, 0.55);
    }

    .pull-line { display: block; }

    .hero-copy > p {
      max-width: 340px;
      margin: 18px 0 0;
      font-size: 13.5px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--muted);
    }

    .icon-row {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    .icon-btn {
      display: grid;
      width: 38px;
      height: 38px;
      padding: 0;
      place-items: center;
      border: 1px solid rgba(246, 237, 255, 0.55);
      border-radius: 50%;
      background: transparent;
      color: var(--cream);
      cursor: pointer;
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .icon-btn:hover,
    .icon-btn:focus-visible {
      background: rgba(246, 237, 255, 0.1);
      border-color: var(--cream);
      outline: none;
    }

    .icon-btn svg {
      width: 16px;
      height: 16px;
      overflow: visible;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.2;
    }

    .icon-btn svg circle { fill: currentColor; stroke: none; }

    .product-card {
      display: grid;
      width: min(320px, 100%);
      grid-template-columns: 86px 1fr;
      grid-template-rows: auto auto;
      gap: 10px 14px;
      padding: 12px;
      border: 1px solid rgba(246, 237, 255, 0.08);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      pointer-events: auto;
    }

    .product-thumb {
      grid-column: 1;
      grid-row: 1 / -1;
      width: 86px;
      min-height: 86px;
      border-radius: 12px;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    .product-body { grid-column: 2; grid-row: 1; }

    .product-body h2 {
      font-size: 11px;
      line-height: 1.25;
      text-transform: uppercase;
      color: var(--cream);
    }

    .product-body p {
      margin: 6px 0 0;
      font-size: 11.5px;
      line-height: 1.45;
      color: var(--muted);
    }

    .cart-btn {
      grid-column: 2;
      grid-row: 2;
      align-self: end;
      justify-self: start;
      padding: 7px 16px;
      border: 1px solid var(--cream);
      border-radius: 999px;
      background: transparent;
      color: var(--cream);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .cart-btn:hover,
    .cart-btn:focus-visible {
      transform: translateY(-1px);
      outline: none;
    }

    .lang-toggle {
      position: absolute;
      top: 36px;
      right: 44px;
      padding: 7px 12px;
      border: 1px solid rgba(246, 237, 255, 0.55);
      border-radius: 999px;
      background: rgba(10, 8, 7, 0.16);
      color: var(--cream);
      font-size: 11px;
      letter-spacing: 0.08em;
      cursor: pointer;
      pointer-events: auto;
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.2s ease;
    }

    .lang-toggle:hover,
    .lang-toggle:focus-visible {
      background: rgba(246, 237, 255, 0.1);
      border-color: var(--cream);
      transform: translateY(-1px);
      outline: none;
    }

    .specs {
      grid-column: 2;
      grid-row: 3;
      justify-self: end;
      width: min(340px, 100%);
      pointer-events: auto;
    }

    .specs h3 {
      margin-bottom: 14px;
      font-size: 11px;
      line-height: 1.2;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .spec-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 7px 0;
    }

    .spec-row + .spec-row { border-top: 1px solid rgba(246, 237, 255, 0.12); }

    .spec-label {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--label);
    }

    .spec-value {
      font-size: 12.5px;
      text-align: right;
      white-space: nowrap;
      color: var(--cream);
    }

    .pull-word {
      display: inline-block;
      opacity: 0;
      transform: translateY(20px);
    }

    .pull-word:not(:last-child) { margin-right: 0.3em; }

    .words-pull-up.words-visible .pull-word {
      animation: wordPullUp 0.55s ease forwards;
    }

    .fade-up-reveal {
      opacity: 0;
      filter: blur(8px);
      transform: translateY(14px);
    }

    .fade-up-reveal.is-visible { animation: fadeUp 0.7s ease forwards; }

    @keyframes heroImageIn {
      from { opacity: 0; transform: scale(1.18); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes wordPullUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); filter: blur(8px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    @media (max-width: 1024px) {
      .hero-ui { padding: 32px 28px 36px; }
      .lang-toggle { top: 32px; right: 28px; }
      .specs { width: min(300px, 100%); }
    }

    @media (max-width: 900px) {
      .hero-ui { padding: 28px 22px 28px; }
      .lang-toggle { top: 28px; right: 22px; }
      .hero-copy h1 { font-size: clamp(1.35rem, 7.2vw, 2.4rem); }
      .hero-base-img,
      .hero-reveal-img { background-position: 40% center; }
      .specs { width: min(280px, 100%); }
    }

    @media (max-width: 768px) {
      .hero-ui {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr auto;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      }

      .hero-left {
        grid-column: 1;
        grid-row: 1 / 3;
        gap: 24px;
      }

      .lang-toggle {
        top: max(24px, env(safe-area-inset-top));
        right: max(20px, env(safe-area-inset-right));
      }

      .specs {
        grid-column: 1;
        grid-row: 3;
        justify-self: stretch;
        width: 100%;
        margin-top: 8px;
      }

      .hero-base-img,
      .hero-reveal-img { background-position: 40% center; }
    }

    @media (max-width: 720px) {
      .hero {
        height: auto;
        min-height: 100vh;
        min-height: 100dvh;
      }

      .hero-ui {
        position: relative;
        display: flex;
        min-height: 100vh;
        min-height: 100dvh;
        flex-direction: column;
        justify-content: flex-start;
        gap: 28px;
        padding: max(22px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      }

      .hero-left {
        display: flex;
        flex: 0 0 auto;
        width: 100%;
        grid-column: auto;
        grid-row: auto;
        justify-content: flex-start;
        gap: 28px;
      }

      .hero-copy {
        width: 100%;
        max-width: 100%;
        padding-right: 48px;
      }

      .hero-copy > p {
        width: 100%;
        font-size: 12.5px;
      }

      .product-card { width: 100%; }

      .specs {
        width: 100%;
        margin-top: auto;
        padding-top: 4px;
      }

      .spec-value { white-space: normal; }

      .hero-base-img,
      .hero-reveal-img { background-position: 40% center; }
    }

    @media (max-width: 480px) {
      .hero-ui {
        gap: 22px;
        padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }

      .lang-toggle { font-size: 10px; }
      .hero-copy h1 { font-size: clamp(1.1rem, 8.5vw, 1.65rem); }
      .hero-copy > p { margin-top: 14px; font-size: 12px; }
      .icon-row { gap: 8px; margin-top: 16px; }
      .icon-btn { width: 34px; height: 34px; }
      .hero-left { gap: 22px; }

      .product-card {
        grid-template-columns: 72px 1fr;
        gap: 8px 12px;
        padding: 10px;
        border-radius: 14px;
      }

      .product-thumb {
        width: 72px;
        min-height: 72px;
        border-radius: 10px;
      }

      .product-body h2 { font-size: 10px; }
      .product-body p { font-size: 11px; }
      .cart-btn { padding: 6px 14px; font-size: 11px; }
      .specs h3 { margin-bottom: 10px; font-size: 10px; }
      .spec-row { gap: 10px; padding: 6px 0; }
      .spec-label,
      .spec-value { font-size: 11px; }
    }

    @media (max-width: 360px) {
      .hero-copy h1 { font-size: 1rem; }
      .product-card { grid-template-columns: 64px 1fr; }
      .product-thumb { width: 64px; min-height: 64px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-image-animate,
      .pull-word,
      .words-pull-up.words-visible .pull-word,
      .fade-up-reveal,
      .fade-up-reveal.is-visible {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="hero" aria-label="Cyber Ronin product hero">
    <div
      class="hero-character"
      aria-hidden="true"
      style="background-image: url('https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260831_115955_2a9adb39-5e9b-4ced-96e2-6900eabe3de9.png&w=1920&q=85');"
    ></div>
    <div
      class="hero-character-highlight"
      id="character-highlight"
      aria-hidden="true"
      style="background-image: url('https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260831_123709_183f0065-efb2-4bb2-a849-13aaa5af2f3f.png&w=1920&q=85');"
    ></div>
    <canvas class="starfield" id="starfield" aria-hidden="true"></canvas>

    <section class="hero-ui" aria-label="Cyber Ronin interface">
      <div class="hero-left">
        <div class="hero-copy">
          <h1 class="words-pull-up">
            <span>RONIN-X //</span>
            <span>SHADOW</span>
            <span>NIGHTFALL</span>
          </h1>
          <p class="fade-up-reveal" data-delay="0.5">Cultivated with high-res optics and a zero-gravity frame for those who don't just watch the future—they wield it. Shift your reality.</p>
          <div class="icon-row fade-up-reveal" data-delay="0.65" aria-label="System controls">
            <button class="icon-btn" type="button" aria-label="Main core">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.4 13.8 4.7v6.6L8 14.6l-5.8-3.3V4.7L8 1.4Z"></path><circle cx="8" cy="8" r="1.35"></circle></svg>
            </button>
            <button class="icon-btn" type="button" aria-label="Vision">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path stroke-linecap="round" d="M2 5.2V2h3.2M14 5.2V2h-3.2M2 10.8V14h3.2M14 10.8V14h-3.2"></path><rect x="5.2" y="5.2" width="5.6" height="5.6"></rect></svg>
            </button>
            <button class="icon-btn" type="button" aria-label="Force">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path stroke-linejoin="round" d="m9.2 1.6-5.2 7.5h3.5l-.7 5.3L12 6.9H8.5l.7-5.3Z"></path></svg>
            </button>
          </div>
        </div>

      </div>

      <button class="lang-toggle fade-up-reveal" id="lang-toggle" data-delay="0.75" type="button" aria-pressed="false" aria-label="Switch to Chinese">中文 / EN</button>

      <section class="specs" aria-labelledby="specs-title">
        <h3 id="specs-title" class="words-pull-up">Operative Specs</h3>
        <div class="spec-row fade-up-reveal" data-delay="1.2"><span class="spec-label">Vision</span><span class="spec-value">Dual 8K Pulse-OLED</span></div>
        <div class="spec-row fade-up-reveal" data-delay="1.3"><span class="spec-label">Nerve</span><span class="spec-value">R1 - Ronin Engines</span></div>
        <div class="spec-row fade-up-reveal" data-delay="1.4"><span class="spec-label">Reflex</span><span class="spec-value">144Hz Low-Lag Ops</span></div>
        <div class="spec-row fade-up-reveal" data-delay="1.5"><span class="spec-label">Armor</span><span class="spec-value">Lightweight Shadow Shell</span></div>
      </section>
    </section>
  </main>

  <script>
    (() => {
      const characterHighlight = document.getElementById('character-highlight');
      const updateCharacterGlow = (event) => {
        const point = event.touches && event.touches[0] ? event.touches[0] : event;
        if (!point || !characterHighlight) return;
        const rect = characterHighlight.getBoundingClientRect();
        const x = point.clientX - rect.left;
        const y = point.clientY - rect.top;
        const radius = window.innerWidth < 480 ? 120 : window.innerWidth < 720 ? 160 : 260;
        const mask = 'radial-gradient(circle ' + radius + 'px at ' + x + 'px ' + y + 'px, #fff 0%, #fff 40%, rgba(255,255,255,0.75) 60%, rgba(255,255,255,0.4) 75%, rgba(255,255,255,0.12) 88%, transparent 100%)';
        characterHighlight.style.webkitMaskImage = mask;
        characterHighlight.style.maskImage = mask;
      };

      window.addEventListener('mousemove', updateCharacterGlow);
      window.addEventListener('touchmove', updateCharacterGlow, { passive: true });

      const canvas = document.getElementById('starfield');
      const context = canvas && canvas.getContext('2d');
      const motionReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let width = 0;
      let height = 0;
      let deviceScale = 1;
      let stars = [];

      const resizeStarfield = () => {
        if (!canvas || !context) return;
        const rect = canvas.getBoundingClientRect();
        width = rect.width;
        height = rect.height;
        deviceScale = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(width * deviceScale);
        canvas.height = Math.floor(height * deviceScale);
        context.setTransform(deviceScale, 0, 0, deviceScale, 0, 0);
        const count = Math.min(260, Math.max(110, Math.floor((width * height) / 7000)));
        stars = Array.from({ length: count }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.45 + 0.25,
          alpha: Math.random() * 0.7 + 0.18,
          twinkle: Math.random() * Math.PI * 2,
          speed: Math.random() * 0.004 + 0.001
        }));
      };

      const drawStarfield = () => {
        if (!canvas || !context) return;
        context.clearRect(0, 0, width, height);
        stars.forEach((star) => {
          star.twinkle += star.speed;
          if (!motionReduced) {
            star.y += 0.035 + star.radius * 0.012;
            if (star.y > height + 2) {
              star.y = -2;
              star.x = Math.random() * width;
            }
          }
          const pulse = motionReduced ? 1 : 0.78 + Math.sin(star.twinkle) * 0.22;
          context.beginPath();
          context.fillStyle = 'rgba(255, 247, 255, ' + Math.max(0.08, star.alpha * pulse) + ')';
          context.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
          context.fill();
        });
        if (!motionReduced) window.requestAnimationFrame(drawStarfield);
      };

      resizeStarfield();
      window.addEventListener('resize', resizeStarfield);
      drawStarfield();

      const splitWords = (element) => {
        if (element.dataset.split) return;
        let wordIndex = 0;

        if (element.tagName === 'H1' && element.children.length) {
          Array.from(element.children).forEach((line) => {
            const words = line.textContent.trim().split(/\s+/).filter(Boolean);
            line.textContent = '';
            line.classList.add('pull-line');
            words.forEach((word) => {
              const span = document.createElement('span');
              span.className = 'pull-word';
              span.textContent = word;
              span.style.animationDelay = (wordIndex * 0.1) + 's';
              line.appendChild(span);
              wordIndex += 1;
            });
          });
        } else {
          const words = element.textContent.trim().split(/\s+/).filter(Boolean);
          element.textContent = '';
          words.forEach((word) => {
            const span = document.createElement('span');
            span.className = 'pull-word';
            span.textContent = word;
            span.style.animationDelay = (wordIndex * 0.1) + 's';
            element.appendChild(span);
            wordIndex += 1;
          });
        }

        element.dataset.split = 'true';
      };

      const wordTargets = Array.from(document.querySelectorAll('.words-pull-up'));
      wordTargets.forEach(splitWords);

      const languageToggle = document.getElementById('lang-toggle');
      const languageContent = {
        en: {
          heading: ['RONIN-X //', 'SHADOW', 'NIGHTFALL'],
          copy: "Cultivated with high-res optics and a zero-gravity frame for those who don't just watch the future—they wield it. Shift your reality.",
          specsTitle: 'OPERATIVE SPECS',
          specs: [
            ['VISION', 'Dual 8K Pulse-OLED'],
            ['NERVE', 'R1 - Ronin Engines'],
            ['REFLEX', '144Hz Low-Lag Ops'],
            ['ARMOR', 'Lightweight Shadow Shell']
          ]
        },
        zh: {
          heading: ['浪人-X //', '暗影', '夜幕'],
          copy: '以高解析光学与零重力机架打造，献给不只是注视未来、而是亲手驾驭未来的人。切换你的现实。',
          specsTitle: '作战规格',
          specs: [
            ['视觉', '双 8K Pulse-OLED'],
            ['神经', 'R1 - 浪人引擎'],
            ['反射', '144Hz 低延迟作战'],
            ['装甲', '轻量化暗影外壳']
          ]
        }
      };

      const rebuildWords = (element, value) => {
        element.dataset.split = '';
        if (element.tagName === 'H1') {
          Array.from(element.children).forEach((line, index) => {
            line.textContent = value[index] || '';
          });
        } else {
          element.textContent = value;
        }
        splitWords(element);
        element.classList.add('words-visible');
      };

      const setLanguage = (language) => {
        const content = languageContent[language];
        rebuildWords(document.querySelector('.hero-copy h1'), content.heading);
        document.querySelector('.hero-copy > p').textContent = content.copy;
        rebuildWords(document.querySelector('.specs h3'), content.specsTitle);

        Array.from(document.querySelectorAll('.spec-row')).forEach((row, index) => {
          row.querySelector('.spec-label').textContent = content.specs[index][0];
          row.querySelector('.spec-value').textContent = content.specs[index][1];
        });

        languageToggle.textContent = language === 'en' ? '中文 / EN' : 'EN / 中文';
        languageToggle.setAttribute('aria-pressed', String(language === 'zh'));
        languageToggle.setAttribute('aria-label', language === 'en' ? '切换到中文' : 'Switch to English');
        document.documentElement.lang = language;
        document.body.dataset.lang = language;
      };

      languageToggle.addEventListener('click', () => {
        setLanguage(document.documentElement.lang === 'en' ? 'zh' : 'en');
      });

      const revealAll = () => {
        wordTargets.forEach((element) => element.classList.add('words-visible'));
        document.querySelectorAll('.fade-up-reveal').forEach((element) => {
          element.style.animationDelay = (element.dataset.delay || 0) + 's';
          element.classList.add('is-visible');
        });
      };

      if ('IntersectionObserver' in window) {
        const wordObserver = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('words-visible');
              wordObserver.unobserve(entry.target);
            }
          });
        }, { threshold: 0.2 });

        const fadeObserver = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.style.animationDelay = (entry.target.dataset.delay || 0) + 's';
              entry.target.classList.add('is-visible');
              fadeObserver.unobserve(entry.target);
            }
          });
        }, { threshold: 0.15 });

        wordTargets.forEach((element) => wordObserver.observe(element));
        document.querySelectorAll('.fade-up-reveal').forEach((element) => fadeObserver.observe(element));
      } else {
        revealAll();
      }
    })();
  </script>
</body>
</html>
